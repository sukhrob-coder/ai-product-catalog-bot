services:
  postgres:
    image: postgres:16-alpine
    container_name: star_elect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-star_elect}
      POSTGRES_USER: ${POSTGRES_USER:-star_elect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-star_elect}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-star_elect} -d ${POSTGRES_DB:-star_elect}"]
      interval: 5s
      timeout: 5s
      retries: 10
  bot:
    build: .
    container_name: star_elect_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
  api:
    build: .
    container_name: star_elect_api
    restart: unless-stopped
    env_file:
      - .env
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
